  /BUPRevenue/commitTrackerData:
    post:
      tags:
        - BUP
      summary: Commit tracker data
      description: Approves or rejects tracker records based on user role and review status.
      operationId: commitTrackerData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  example: 123
                trackerIds:
                  type: array
                  items:
                    type: integer
                  example: [101, 102, 103]
                isActive:
                  type: boolean
                  example: true
                reviewStatus:
                  type: string
                  enum: ["accepted", "rejected"]
                  example: "accepted"
                Comment:
                  type: string
                  example: "Requires additional details for approval."
      responses:
        '200':
          description: Tracker data committed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tracker data committed successfully"
        '400':
          description: Invalid request due to missing or incorrect parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid request. trackerIds should be an array of IDs."
        '403':
          description: Access denied due to insufficient permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Access denied. Insufficient permissions."
        '404':
          description: No inactive records found for the provided Account and Geography.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "No inactive records found for the provided Account and Geography."
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unknown error"                             
