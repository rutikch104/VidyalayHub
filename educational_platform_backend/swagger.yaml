openapi: 3.0.0
info:
  title: Swagger BUP - OpenAPI 3.0
  description:  |
    # BUP APIs
    ## This is a BUP server
    ### Contains APIs to manage the BUP App
    #### Note that the APIs support Authentication
    ##### The samples contain Request and Response models
servers:
  # - url: https://api.bup-dev.myatos.net/api
   - url: http://localhost:8081/api
tags:
  - name: Authentication
    description: Operations about Authentication 
  - name: User
    description: Operations about user
  - name: Customer
    description: Everything about customer
  - name: BUP
    description: Everything about revenue
paths:
  /Authentication/SignIn:
    post:
      tags:
        - Authentication
      summary: Logs user into the system
      description: 'User login with their Email and password'
      operationId: loginUser
      requestBody:
        description: Created user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth'
          application/xml:
            schema:
              $ref: '#/components/schemas/Auth'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Auth'
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
            application/xml:
              schema:
                $ref: '#/components/schemas/Auth'
  /users/create:
    post:
      tags:
        - User
      summary: Create user
      description: This can only be done by the logged in user.
      operationId: createUser
      requestBody:
        description: Created user object
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  description: ID of the user
                Name:
                  type: string
                  description: Name of the user
                email:
                  type: string
                  description: Email of the user
                password:
                  type: string
                  description: Password of the user
                isActive:
                  type: boolean
                  description: Status of the user
                role:
                  type: array
                  items:
                    type: string
                  description: Roles assigned to the user
                customer:
                  type: array
                  items:
                    type: object
                    properties:
                      Id:
                        type: integer
                      Account:
                        type: string
                      Geography:
                        type: string
                      Country:
                        type: string
                  description: Customers associated with the user
                geography:
                  type: string
                  description: Geography of the user
                Business_Line:
                  type: string
                  description: Business line of the user
      responses:
        '200':
          description: User saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Unknown error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
  /users/UpdateUser:
    put:
      tags:
        - User
      summary: Update an existing userDetails
      description: Update an existing user by Id
      operationId: updateUser
      requestBody:
        description: Update an existed User
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  description: ID of the user performing the update
                id:
                  type: integer
                  description: ID of the user to update
                email:
                  type: string
                  description: Email of the user
                clientName:
                  type: array
                  items:
                    type: object
                    properties:
                      Id:
                        type: integer
                      Account:
                        type: string
                      Geography:
                        type: string
                      Country:
                        type: string
                  description: Clients associated with the user
                name:
                  type: string
                  description: Name of the user
                businessLine:
                  type: string
                  description: Business line of the user
                geography:
                  type: string
                  description: Geography of the user
                isActive:
                  type: boolean
                  description: Status of the user
                roles:
                  type: array
                  items:
                    type: string
                  description: Roles assigned to the user
          application/xml:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  description: ID of the user performing the update
                id:
                  type: integer
                  description: ID of the user to update
                email:
                  type: string
                  description: Email of the user
                clientName:
                  type: array
                  items:
                    type: object
                    properties:
                      Id:
                        type: integer
                      Account:
                        type: string
                      Geography:
                        type: string
                      Country:
                        type: string
                  description: Clients associated with the user
                name:
                  type: string
                  description: Name of the user
                businessLine:
                  type: string
                  description: Business line of the user
                geography:
                  type: string
                  description: Geography of the user
                isActive:
                  type: boolean
                  description: Status of the user
                roles:
                  type: array
                  items:
                    type: string
                  description: Roles assigned to the user
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  description: ID of the user performing the update
                id:
                  type: integer
                  description: ID of the user to update
                email:
                  type: string
                  description: Email of the user
                clientName:
                  type: array
                  items:
                    type: object
                    properties:
                      Id:
                        type: integer
                      Account:
                        type: string
                      Geography:
                        type: string
                      Country:
                        type: string
                  description: Clients associated with the user
                name:
                  type: string
                  description: Name of the user
                businessLine:
                  type: string
                  description: Business line of the user
                geography:
                  type: string
                  description: Geography of the user
                isActive:
                  type: boolean
                  description: Status of the user
                roles:
                  type: array
                  items:
                    type: string
                  description: Roles assigned to the user
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string          
            application/xml:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid ID supplied
        '404':
          description: User not found
        '500':
          description: Error updating user and customer consultant
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
  /users/getAll:
    get:
      tags:
        - User
      summary: Returns all registered users
      description: Returns all users
      operationId: getAll
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
      security:
        - bearerAuth: []  
  /users/GetAlldetails:
    get:
      tags:
        - User
      summary: Get all user details
      description: Retrieve all user details including roles
      operationId: getAllDetails
      responses:
        '200':
          description: Successfully retrieved user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          type: integer
                        Email:
                          type: string
                        Name:
                          type: string
                        Business_Line:
                          type: string
                        Geography:
                          type: string
                        IsActive:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        roles:
                          type: array
                          items:
                            type: object
                            properties:
                              roleName:
                                type: string
        '500':
          description: Error fetching user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
  /users/DeleteUser/{id}:
    delete:
      tags:
        - User
      summary: Delete a user by ID
      description: Deletes a user and associated data (Useraccountmapping, Role, and Notification) by user ID
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user to delete
      responses:
        '204':
          description: Successfully deleted the user
        '500':
          description: Unknown error occurred while deleting the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /users/businessline:
    get:
      tags:
        - User
      summary: Get and validate business lines for a user
      description: Retrieve the business lines for a given user and check if a specific business line is included
      operationId: getAllBl
      parameters:
        - name: businessline
          in: header
          required: true
          schema:
            type: string
          description: The business line to validate
        - name: userid
          in: header
          required: true
          schema:
            type: string
          description: The ID of the user to retrieve business lines for
      responses:
        '200':
          description: Successfully retrieved and validated business line
          content:
            application/json:
              schema:
                type: boolean
        '500':
          description: Error fetching business lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
  /users/getusersdetail:
    post:
      tags:
        - User
      summary: Get details of multiple users
      description: Retrieve user details based on an array of user IDs
      operationId: getUsersDetail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usersArray:
                  type: array
                  items:
                    type: integer
              required:
                - usersArray
      responses:
        '200':
          description: Successfully retrieved user details
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Id:
                      type: integer
                    Email:
                      type: string
                    Name:
                      type: string
        '400':
          description: Invalid usersArray provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: An error occurred while fetching user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /users/getGeoClient:
    post:
      tags:
        - User
      summary: Get distinct clients by geography and country
      description: Retrieve distinct client accounts based on provided geography and country
      operationId: getGeoClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                geography:
                  type: string
                country:
                  type: string
              required:
                - geography
                - country
      responses:
        '200':
          description: Successfully retrieved distinct clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Account:
                          type: string
                  message:
                    type: string
        '500':
          description: Error fetching distinct clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /users/getGeoData:
    post:
      tags:
        - User
      summary: Get distinct periods by geography, client, and country
      description: Retrieve distinct periods and transform them into quarters based on provided geography, client, and country
      operationId: getGeoData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                geography:
                  type: string
                client:
                  type: string
                country:
                  type: string
              required:
                - geography
                - client
                - country
      responses:
        '200':
          description: Successfully retrieved and transformed periods into quarters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
        '500':
          description: Error fetching periods
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /users/deleteGeoClientData:
    post:
      tags:
        - User
      summary: Delete client data by geography, client, country, and quarter
      description: Delete client data by setting the Flag to 'false' for the specified geography, client, country, and quarter
      operationId: deleteGeoClientData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                geography:
                  type: string
                client:
                  type: string
                country:
                  type: string
                Quarter:
                  type: array
                  items:
                    type: string
              required:
                - geography
                - client
                - country
                - Quarter
      responses:
        '200':
          description: Successfully deleted client data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Error deleting client data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /users/geographies:
    get:
      tags:
        - User
      summary: Returns all Geographies
      description: Returns all Geographies
      operationId: getAllGeographies
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
      security:
        - bearerAuth: [] 
  /users/clients:
    get:
      tags:
        - User
      summary: Returns all clients
      description: Returns all clients
      operationId: getAllclients
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
      security:
        - bearerAuth: [] 
  /customer/create:
    post:
      tags:
        - Customer
      summary: Create customer
      description: This can only be done by the admin role.
      operationId: createCustomer
      requestBody:
        description: Create customer object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
          application/xml:
            schema:
              $ref: '#/components/schemas/Customer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
            application/xml:
              schema:
                $ref: '#/components/schemas/Customer'
  /Customers/Update:
    put:
      tags:
        - Customer
      summary: Update an existing customerDetails
      description: Update an existing customer by Id
      operationId: updateCustmer
      requestBody:
        description: Update an existed customer
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
          application/xml:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerUpdate'          
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomerUpdate'
        '400':
          description: Invalid ID supplied
        '404':
          description: Customer not found
        '405':
          description: Validation exception  
  /Customers/getAll:
    get:
      tags:
        - Customer
      summary: Returns all customers
      description: Returns all customers
      operationId: getAll
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
      security:
        - bearerAuth: []
  /Customers/GetAllCustomers:
    get:
      tags:
        - Customer
      summary: Returns all customerswithidname
      description: Returns all customerswithidname
      operationId: getAll
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
      security:
        - bearerAuth: []
  /Customers/get-customers-by-geography:
    post:
      tags:
        - Customer
      summary: Get Customers by geography
      description: This can only be done by the logged in user.
      operationId: Get Customers by geography
      requestBody:
        description: Get Customers by geography
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientGeo'
          application/xml:
            schema:
              $ref: '#/components/schemas/ClientGeo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientGeo'
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientGeo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ClientGeo' 
  /Customers/GetAllCustomer:
    post:
      tags:
        - Customer
      summary: Get Mapped users and customers
      description: This can only be done by the logged in user.
      operationId: Get Mapped users and customers
      requestBody:
        description: Get Mapped users and customers
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Clientmap'
          application/xml:
            schema:
              $ref: '#/components/schemas/Clientmap'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Clientmap'
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clientmap'
            application/xml:
              schema:
                $ref: '#/components/schemas/Clientmap' 
  /Customers/Delete/{id}:
    delete:
      tags:
        - Customer
      summary: Delete a customer record by ID
      description: Deletes a customer from the 'Account' table and removes related entries from 'Useraccountmapping'.
      operationId: deleteCustomer
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the customer account to delete.
          schema:
            type: string
            example: "1234"
      responses:
        '204':
          description: Customer record deleted successfully.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "unknown_error"
  /Customers/userRoleCustomer:
    post:
      tags:
        - Customer
      summary: Get all customers based on user roles
      description: Retrieves customer data based on user roles such as Admin, GBU, Editor, and Viewer.
      operationId: getAllCustomerRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The ID of the user.
                  example: "12345"
                Version:
                  type: string
                  description: The version of customer data to retrieve.
                  example: "v1.0"
      responses:
        '200':
          description: Successful retrieval of customer roles and grouped accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  groupedAccountsArray:
                    type: array
                    description: Grouped accounts by geography and country.
                    items:
                      type: object
                      properties:
                        Geography:
                          type: string
                          example: "GrM"
                        Country:
                          type: string
                          example: "MEV"
                        grouped_name:
                          type: string
                          example: "SIEMENS AG"
                  customers:
                    type: array
                    description: List of customers based on the user's role.
                    items:
                      type: object
                      properties:
                        Id:
                          type: string
                          example: "123"
                        Account:
                          type: string
                          example: "Siemens Healthcare"
                        Geography:
                          type: string
                          example: "EU"
                        Country:
                          type: string
                          example: "Germany"
                        Top:
                          type: string
                          example: "Top Acct"
        '400':
          description: Invalid request. Missing required parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid request."
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "unknown_error"
  /Customers/updateCustomerConsultant:
    put:
      tags:
        - Customer
      summary: Update Customer-Consultant Mapping
      description: Updates the mapping of a customer consultant to a new customer account.
      operationId: updateCustomerConsultant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userid:
                  type: string
                  description: ID of the user performing the update.
                  example: "12345"
                UserId:
                  type: string
                  description: The user ID associated with the consultant.
                  example: "67890"
                CustomerId:
                  type: string
                  description: The current customer ID.
                  example: "11111"
                newCustomerId:
                  type: string
                  description: The new customer ID to update the mapping.
                  example: "22222"
      responses:
        '200':
          description: Successfully updated the customer-consultant mapping.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: integer
                    example: 1
        '400':
          description: Invalid request. Missing required parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid request."
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Error updating customer-consultant"
                  error:
                    type: string
                    example: "Database error details"
  /Customers/DeleteCustomerConsultant/{UserId}/{CustomerId}:
    delete:
      tags:
        - Customer
      summary: Delete Customer-Consultant Relationship
      description: Deletes the mapping between a customer and a consultant.
      operationId: deleteCustomerConsultant
      parameters:
        - name: UserId
          in: path
          required: true
          description: The ID of the consultant user.
          schema:
            type: string
          example: "67890"
        - name: CustomerId
          in: path
          required: true
          description: The ID of the customer account.
          schema:
            type: string
          example: "11111"
      responses:
        '200':
          description: Successfully deleted the customer-consultant relationship.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Customer-consultant relationship deleted successfully"
        '400':
          description: Invalid request. Missing required parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid request."
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Error deleting customer-consultant"
                  error:
                    type: string
                    example: "Database error details"
