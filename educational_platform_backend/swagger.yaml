  /BUPRevenue/getDataRevenueALL:
    get:
      tags:
        - BUP
      summary: Returns all BUP Data
      description: Returns all Data of revenue
      operationId: getAll
      parameters:
        - name: client
          in: header
          description: ID of supplier to return
          required: true
          schema:
            type: string
            format: string
